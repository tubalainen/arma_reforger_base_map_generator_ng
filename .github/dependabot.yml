# The daily audit in .github/workflows/security-audit.yml reports what is
# vulnerable or stale; Dependabot is what actually opens the bump PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: /webapp
    schedule:
      interval: daily
      time: '06:00'
      timezone: Europe/Stockholm
    # A compromised release is usually pulled within days, and a regression is
    # usually reported within days; both argue for not taking a brand-new
    # version automatically.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps
    ignore:
      # GDAL must match the system libgdal that the Dockerfile installs from
      # Debian Bookworm (3.6.2). Bumping the wheel without the base image is a
      # broken build, so this one moves by hand.
      - dependency-name: GDAL

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '06:00'
      timezone: Europe/Stockholm
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: docker
