services:
  arma-map-generator:
    image: ghcr.io/tubalainen/arma_reforger_base_map_generator_ng:latest
    # To build locally instead of pulling from GHCR, comment out 'image' above
    # and uncomment the 'build' section below:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      # Bind to localhost for nginx reverse proxy
      # For local network access, add your LAN IP: "192.168.x.x:8080:8080"
      - "127.0.0.1:8080:8080"
    volumes:
      - map_output:/app/output
      # Read-only view of the Overpass sidecar's region marker, so the UI can
      # tell when .env asks for a different country than the one loaded.
      # Empty (and harmless) when the local-osm profile is not in use.
      - overpass_meta:/overpass_meta:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Trust proxy headers from nginx/reverse proxy
      - FORWARDED_ALLOW_IPS=127.0.0.1
      # Container timezone — controls timestamps in server logs so they
      # match the operator's wall clock and the browser UI. Defaults to UTC
      # if not set in .env. Examples: Europe/Stockholm, America/New_York.
      - TZ=${TZ:-UTC}
      # Log verbosity for both `docker compose logs` and the browser
      # Activity Log. DEBUG adds per-tile / per-feature tracing.
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    # Resource limits
    # Large maps (20+ km) with high-res elevation (1m LiDAR) need extra resources.
    # The pipeline uses ProcessPoolExecutor for CPU-bound heightmap/surface work
    # and concurrent tile downloads — more CPUs = faster generation.
    # Peak memory for 20x20 km at 1m: ~1.5-2 GB (float32 arrays + merge buffers).
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 2G
    # Security options
    security_opt:
      - no-new-privileges:true
    # Health check (also defined in Dockerfile)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------
  # Optional self-hosted Overpass sidecar (profile: local-osm)
  # ---------------------------------------------------------------------
  # Start with:  docker compose --profile local-osm up -d
  # Without the profile these services do not exist and the app behaves
  # exactly as before, querying the public mirror pool.
  #
  # Set OVERPASS_LOCAL_COUNTRIES in .env (e.g. SE) to choose the extract.
  # Changing it and restarting triggers an automatic re-import.
  # OVERPASS_LOCAL_MIRROR picks where the extract comes from; there is nothing
  # to change in this file if Geofabrik blocks you.

  # One-shot: resolves the country code to an extract on the configured
  # mirror and clears the database volume if the region changed. Uses the app
  # image so the country -> extract mapping lives in exactly one place.
  overpass-local-init:
    profiles: ["local-osm"]
    image: ghcr.io/tubalainen/arma_reforger_base_map_generator_ng:latest
    entrypoint: ["python", "/app/scripts/overpass_local_init.py"]
    # Needs to remove files written by the Overpass container, which runs as root.
    user: "0:0"
    env_file:
      - .env
    volumes:
      - overpass_db:/db
      - overpass_meta:/overpass_meta
    restart: "no"

  overpass-local:
    profiles: ["local-osm"]
    image: wiktorn/overpass-api:latest
    depends_on:
      overpass-local-init:
        condition: service_completed_successfully
    # The image has no ENTRYPOINT, only CMD ["/app/docker-entrypoint.sh"].
    # The init step writes this launcher with the resolved URLs already baked
    # in, so there is no shell interpolation to escape in this file.
    command: ["sh", "/overpass_meta/start.sh"]
    environment:
      OVERPASS_MODE: init
      # Geofabrik ships .osm.pbf but the importer needs bzip2 XML, so the file
      # is converted after download. The default conversion lives in the app
      # image (config/overpass_local.py) and is written into the launcher by
      # the init step — so `docker compose pull` delivers it and there is
      # nothing to hand-merge here. This line only passes an override through.
      OVERPASS_PLANET_PREPROCESS: ${OVERPASS_PLANET_PREPROCESS:-}
      # The public <region>-latest.osm.pbf carries no user names or IDs, and we
      # only read geometry and tags, so "no" is correct and much smaller.
      OVERPASS_META: "no"
      # Every query we issue is way/relation under a global [bbox:...]; we
      # never use area[] or is_in, and area generation is a large slice of
      # both import time and ongoing CPU.
      OVERPASS_USE_AREAS: "false"
      # Defaults to true, which stops the container after the import instead
      # of serving. We want it to go straight to serving and applying diffs.
      OVERPASS_STOP_AFTER_INIT: "false"
      # The init step writes a weekly default into the launcher: OSM geometry
      # does not move fast enough for a terrain generator to care, and the
      # mirrors are volunteer-run. Set this in .env only to override that.
      OVERPASS_UPDATE_SLEEP: ${OVERPASS_UPDATE_SLEEP:-}
      OVERPASS_MAX_TIMEOUT: "300"
      OVERPASS_RATE_LIMIT: "0"
      TZ: ${TZ:-UTC}
    volumes:
      - overpass_db:/db
      - overpass_meta:/overpass_meta:ro
    # NOT unless-stopped: a failing import leaves no /db/init_done, so the
    # entrypoint re-runs its download-and-import branch on every restart. The
    # extract is cached after the first successful download so a retry reads it
    # from disk, but the cap stays — an endless restart loop is still an
    # endless loop, and repeated downloads are what gets an IP firewalled.
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 4G
    security_opt:
      - no-new-privileges:true

volumes:
  map_output:
  # Overpass database. Sized from the extract: roughly 8-12x the compressed
  # PBF, so Sweden's 0.76 GB extract lands around 8 GB. Add the extract itself
  # once more: it is cached under /db/extract_cache until the import succeeds,
  # so a retry does not re-download it.
  overpass_db:
  # Tiny volume carrying the resolved region + URLs between the init step,
  # the sidecar and the web app.
  overpass_meta:
